<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="985"
     height="580"
     viewBox="0 0 985 580"
     font-family="Consolas, 'Courier New', monospace">

<style>
.key {
  fill:#ffa657;
}

.value {
  fill:#a5d6ff;
}

.green {
  fill:#86efac;
}

.blue {
  fill:#58a6ff;
}

.prompt {
  fill:#2AA9E0;
}

.sep {
  fill:#7d8590;
}

.out {
  fill:#c9d1d9;
}

.muted {
  fill:#8b949e;
}

text {
  white-space:pre;
}

@media (prefers-reduced-motion: no-preference) {

  .t {
    opacity:0;
    animation:tline .25s ease forwards;
  }

  .cursor {
    animation:
      tline .25s ease forwards,
      blink 1.1s steps(1) infinite;
  }

  @keyframes tline {
    from {
      opacity:0;
    }
    to {
      opacity:1;
    }
  }

  @keyframes blink {
    0%,49% {
      opacity:1;
    }

    50%,100% {
      opacity:0;
    }
  }
}
</style>


