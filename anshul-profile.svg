<style>
@font-face {
  src: local('Consolas'), local('Consolas Bold');
  font-family: 'ConsolasFallback';
  font-display: swap;
  -webkit-size-adjust: 109%;
  size-adjust: 109%;
}
.key {fill:#ffa657;}
.value {fill:#a5d6ff;}
.addColor {fill:#3fb950;}
.delColor {fill:#f85149;}
.cc {fill:#616e7f;}
.prompt {fill:#2AA9E0;}
.sep {fill:#7d8590;}
.out {fill:#8b949e;}
text,tspan {white-space:pre;}
@media (prefers-reduced-motion:no-preference) {
  .t {opacity:0; animation:tline .25s ease forwards;}
  .t.cursor {animation:tline .25s ease forwards, blink 1.1s steps(1) infinite;}
  @keyframes tline {from{opacity:0;}to{opacity:1;}}
  @keyframes blink {0%,49%{opacity:1;}50%,100%{opacity:0;}}
}
</style>
